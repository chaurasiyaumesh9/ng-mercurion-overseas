<div class="flex justify-between items-center">
  <!-- Result Count Placeholder (optional future use) -->
  <div class="text-sm text-gray-500">Sort By</div>

  <!-- Sort Dropdown -->
  <div class="relative">
    <select
      class="border px-3 py-1 rounded text-sm"
      [value]="currentSort()"
      (change)="updateSort($any($event.target).value)"
    >
      @for (option of sortOptions; track option.value) {
        <option [value]="option.value">
          {{ option.label }}
        </option>
      }
    </select>
  </div>
</div>
